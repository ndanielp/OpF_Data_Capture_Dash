<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Como opera uma instituição? · Open Finance 2.0</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('opf:v2:theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/v2/v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="/static/v2/shell.js"></script>
</head>
<body>
<header id="v2-header" class="v2-header"></header>
<main class="v2-main">
  <div class="v2-title"><h1 id="inst-title">Como opera uma instituição</h1></div>
  <section class="v2-card">
    <div class="v2-placeholder">
      <p>Esta aba ainda está em construção no Dashboard 2.0.</p>
      <p>Enquanto isso, o perfil de cada instituição está no <a href="/profile">Perfil Receptores do painel atual</a>.</p>
    </div>
  </section>
</main>
<script>
V2.initShell('instituicao').then(meta => {
  const uuid = new URLSearchParams(location.search).get('uuid');
  const inst = uuid && meta.institutions.find(i => i.uuid === uuid);
  if (inst) {
    V2.setFilters({ institution: inst.uuid });
    document.getElementById('inst-title').textContent = 'Como opera: ' + inst.short;
  }
}).catch(() => {});
</script>
</body>
</html>
