# Docker Compose para uso LOCAL apenas (dashboard contra o DB do data-loader).
# Produção é via Cloud Run + deploy.ps1 (não usa este arquivo).
#
# Sem GCS_BUCKET no .env, o entrypoint usa o DB montado em /app/data.
# Com GCS_BUCKET setado, o entrypoint baixa do bucket e sobrescreve o mount —
# evite isso em dev para não corromper o DB do data-loader.

services:
  dashboard:
    build: .
    container_name: opf_dashboard
    ports:
      - "8000:8000"
    volumes:
      - ../data-loader/data:/app/data   # DB único — fonte do data-loader
      - ./logs:/app/logs
      - ./credentials:/app/credentials
    env_file:
      - .env
    restart: unless-stopped
