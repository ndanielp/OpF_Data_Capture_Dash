services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: opf_dashboard
    ports:
      - "8000:8000"
    volumes:
      # Montar diretórios locais para persistência — :z necessário para SELinux no Linux
      - ./data:/app/data:z
      - ./logs:/app/logs:z
      - ./credentials:/app/credentials:z
    env_file:
      - .env
    command: ["python", "main.py", "dashboard", "--port", "8000"]
    restart: unless-stopped

  batch:
    build: .
    container_name: opf_batch
    volumes:
      - ./data:/app/data:z
      - ./logs:/app/logs:z
      - ./credentials:/app/credentials:z
    env_file:
      - .env
    # Este container roda os coletores e depois é finalizado automaticamente
    command: ["python", "main.py", "run"]
